<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奶娃交通大学 · 群聊</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #ececec;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: 2px;
    }
    .hint {
      margin: 0;
      color: #666;
      font-size: 14px;
    }
    img {
      max-width: min(100%, 1200px);
      width: auto;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      background: #fff;
    }
    a.back {
      color: #389e6b;
      text-decoration: none;
      font-size: 14px;
    }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>奶娃交通大学</h1>
    <p class="hint">扫一扫二维码，加入群聊</p>
    <img src="./assets/composite.png" alt="SJTU奶龙群二群 拼合图">
    <a class="back" href="./index.html">再抽一次</a>
  </div>
</body>
</html>
